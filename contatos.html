<!DOCTYPE html> 
<html lang="pt-br"> 

<head>

    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zelda - Contatos</title> 

    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <div class="caixa">

            <h1>ZELDA</h1>

            <nav> 

                <ul>
                    <li><a href="index.html">INÍCIO</a></li>
                    <li><a href="servicos.html">AVENTURAS</a></li>
                    <li><a href="contatos.html">CONTATOS</a></li>
                </ul>

            </nav>

        </div>

    </header>

    <main>

        <div class="mapa">

            <h2>Entre em contato</h2>

            <p>
                Gostou do mundo de The Legend of Zelda?
                Tem alguma dúvida ou gostaria de compartilhar
                sua opinião sobre o jogo? Entre em contato conosco!
            </p>

            <form>

                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" required>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" placeholder="Digite seu telefone">

                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" placeholder="Digite sua mensagem" required></textarea>

                <button type="submit">ENVIAR</button>

            </form>

        </div>

    </main>

    <footer>

        <p class="copyright">
            &#169; The Legend of Zelda - Uma aventura lendária.
        </p>

    </footer>

</body>

</html>
